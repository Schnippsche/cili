<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Willkommen!</title>
  <link rel="stylesheet" href="../fragments/email-styles.css" th:remove="all">
  <!-- CSS inline einfügen -->
  <style th:insert="~{fragments/email-styles :: css}"></style>
</head>

<body>
<div class="card">
  <h2>Willkommen, <span th:text="${user.displayName}">Freund</span>!</h2>
  <p>
    Schön, dass du jetzt Teil unserer Community bist.
    Deine registrierte E‑Mail lautet:
    <strong th:text="${user.email}">email@example.com</strong>
  </p>

  <a class="btn" th:href="${user.url}">Zu deinem Profil</a>

  <div class="footer">
    Du möchtest keine E‑Mails mehr erhalten?<br/>
    <a th:href="@{/unsubscribe(token=${unsubscribeToken}, userId=${user.id})}">
      Newsletter abbestellen
    </a>
  </div>

</div>
</body>
</html>
