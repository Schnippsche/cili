<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Willkommen bei unserem Service!</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
    .card { max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9; }
    h2 { color: #2c3e50; margin-top: 0; }
    .btn { display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
    .footer { margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #666; }
    .footer a { color: #007bff; }
  </style>
</head>

<body>
<div class="card">
  <h2>Willkommen!</h2>
  <p>
    Liebe/r <span th:text="${customer.name}">Kunde</span>,<br/>
    schön, dass Sie sich bei uns registriert haben!
  </p>

  <p>
    Ihre E‑Mail-Adresse: <strong th:text="${customer.email}">email@example.com</strong>
  </p>

  <p>
    <span th:if="${sponsor}">
      Ihr Ansprechpartner: <strong th:text="${sponsor.email}">sponsor@example.com</strong>
    </span>
  </p>

  <p>
    Wir freuen uns auf die Zusammenarbeit!
  </p>

  <div class="footer">
    Sie möchten keine E‑Mails mehr erhalten?<br/>
    <a th:href="${unsubscribeUrl}">
      Abmelden
    </a>
  </div>

</div>
</body>
</html>
