spring:
  application:
    name: cili
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  thymeleaf:
    check-template-location: false   # programmatische Nutzung, kein MVC-ViewResolver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false

server:
  tomcat:
    max-http-post-size: -1

cili:
  version: '@project.version@'
  python-path: python3
  scripts-dir: /opt/cili/scripts

  search:
    max-snippets-per-hit: 6
    max-page-size: 200

  security:
    max-login-attempts: 5
    login-lockout-minutes: 15

  share:
    token-validity-days: 90          # Gültigkeitsdauer für Freigabe-Links in Tagen
    base-url: "https://cili.toengi.de"

  logs:
    path: ./logs

  jwt:
    access-token-expiry: 900000      # 15 minutes in ms
    refresh-token-expiry: 86400000  # 1 day in ms
  storage:
    base-path: /var/cili/data
    ffmpeg-path: /usr/bin/ffmpeg
    ffprobe-path: /usr/bin/ffprobe
    libre-office-path: /usr/bin/soffice

  libreoffice:
    timeout-minutes: 5

  ffmpeg:
    target-height: 720
    # video-codec: libx264
    video-codec: h264_nvenc
    audio-codec: aac
    crf: 23
    preset: medium
    max-bitrate: 4000k
    parallel-jobs: 1
    timeout-minutes: 60
    temp-dir: /tmp/cili-ffmpeg

  whisper:
    script-name: transcribe_worker.py
    language: auto
    model: medium
    # cpu oder cuda
    device: cuda
    compute-type: int8_float16
    beam-size: 5        # 1=greedy (2-3x schneller, leicht ungenauer), 5=Standard
    timeout-minutes: 30
    # Cue-Darstellung (Untertitel-Aufteilung)
    max-chars: 84       # max. Zeichen pro Cue, bevor ein Satz aufgeteilt wird
    max-duration: 6.0   # max. Dauer (s) pro Cue, bevor aufgeteilt wird
    cue-pad: 0.2        # Nachlauf (s), der an jeden Cue angehängt wird
    # glossary-path: /var/cili/models/glossar.txt
    # corrections-path: /opt/cili/corrections.txt

  nllb:
    script-name: translate_worker.py
    doc-script-name: doc_translate_worker.py
    device: cpu          # cpu | cuda
    compute-type: int8   # int8 | int8_float16 | float32
    beam-size: 4
    timeout-minutes: 10

  audio:
    normalize: true
    # acompressor reduziert Übersteuerung, loudnorm normalisiert auf EBU R128
    filter-chain: "acompressor=threshold=-20dB:ratio=4:attack=5:release=50,loudnorm=I=-16:TP=-1.5:LRA=11"
    audio-bitrate: "128k"

  processing:
    video-concurrency: 1   # Anzahl gleichzeitiger Video-Workflows (Transcode + WAV + Whisper)

  video-workflow:
    zombie-timeout-minutes: 90
    max-retries: 3

  report:
    max-results: 50

  ollama:
    url: http://localhost:11434
    model: qwen2.5:7b-instruct
    num-ctx: 36864
    timeout-minutes: 30

    idle-backfill:
      enabled: true
      interval: PT10M
      language: de

  video-import:
    script-name: video_upload.py
    cili-url: http://localhost:8080
    cili-user: admin
    cili-pass: admin
    max-height: 720
    timeout-minutes: 120

  telegram:
    enabled: true                              # true → nächtlicher Cron läuft
    script-name: telegram_import.py
    timeout-minutes: 60
    cili-user: Stefan                          # Job-Token wird für diesen Benutzer generiert (CILI_TOKEN)
    sources:
      - name: telegram-menschen
        label: Menschen
        env-name: telegram_import_menschen.env
        cron: "0 0 1 * * *"                    # täglich 01:00 Uhr
      - name: telegram-tiere
        label: Tiere
        env-name: telegram_import_tiere.env
        cron: "0 30 1 * * *"                   # täglich 01:30 Uhr
